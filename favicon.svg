<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mengyuan He — asterisk mark">
  <title>Mengyuan He</title>
  <rect width="64" height="64" fill="#F7F4EF"/>
  <!-- Asterisk: an academic footnote marker, drawn as three crossing strokes. -->
  <g stroke="#1C1B19" stroke-width="3.2" stroke-linecap="round">
    <line x1="32" y1="14" x2="32" y2="50"/>
    <line x1="14" y1="32" x2="50" y2="32"/>
    <line x1="19.3" y1="19.3" x2="44.7" y2="44.7"/>
    <line x1="44.7" y1="19.3" x2="19.3" y2="44.7"/>
  </g>
  <circle cx="32" cy="32" r="3" fill="#8A2E24"/>
</svg>
